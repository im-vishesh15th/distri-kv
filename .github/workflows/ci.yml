name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Vet, Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod/go.sum
        run: go mod verify

      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Code not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Build server
        run: go build -o /tmp/distrikv ./cmd/server

      - name: Build client
        run: go build -o /tmp/distrikv-client ./cmd/client

  docker:
    name: Docker Build + Cluster Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Validate compose file (docker compose v2)
        run: docker compose config --quiet

      - name: Build image via compose
        run: docker compose build

      - name: Cluster smoke test (up --wait, write/read, kill node, verify)
        run: |
          set -euo pipefail
          docker compose up -d --wait

          CGO_ENABLED=0 go build -o /tmp/dkv-client ./cmd/client
          NET=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' distrikv-1)

          # The client must run INSIDE the compose network: peer addresses
          # are container hostnames, so leader hints are unresolvable from
          # the host. Alpine can run the statically-linked client binary.
          cli() {
            docker run --rm --network "$NET" \
              -v /tmp/dkv-client:/dkv:ro alpine:3.20 \
              /dkv -addr="$1" "${@:2}"
          }
          retry() { # retry <tries> <cmd...>
            local tries=$1 i; shift
            for i in $(seq 1 "$tries"); do
              if "$@"; then return 0; fi
              sleep 1
            done
            echo "FAILED after $tries tries: $*" >&2
            return 1
          }
          expect() { # expect <addr> <cmd> <key> <want>
            local got
            got=$(cli "$1" "$2" "$3") || return 1
            test "$got" = "$4"
          }

          # Healthcheck only proves the port is open; wait for a leader.
          retry 30 cli distrikv-1:8080 set smokekey smokevalue
          retry 30 expect distrikv-2:8080 get smokekey smokevalue

          # Kill one node: 2/3 quorum must keep serving and accepting writes.
          docker kill distrikv-1 > /dev/null
          retry 30 expect distrikv-3:8080 get smokekey smokevalue
          retry 30 cli distrikv-3:8080 set smokekey smokevalue2
          retry 30 expect distrikv-2:8080 get smokekey smokevalue2
          echo "cluster smoke test passed"

      - name: Tear down compose
        if: always()
        run: docker compose down -v

  e2e:
    name: Product E2E (gateway + cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack, create demo tenant and key
        run: ./scripts/demo_up.sh

      - name: Run end-to-end checks
        run: ./scripts/e2e_signup.sh

      - name: Run control-plane (web console API) end-to-end checks
        run: ./scripts/e2e_control.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose --profile monitoring down -v

  e2e-multigroup:
    name: Product E2E Multigroup (gateway + 3-group cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start multigroup stack
        run: docker compose -f docker-compose.yml -f docker-compose.multigroup.yml up -d --wait

      - name: Run multigroup end-to-end checks
        run: ./scripts/e2e_multigroup.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.multigroup.yml logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.multigroup.yml down -v

