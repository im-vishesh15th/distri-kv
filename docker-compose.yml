# DistriKV stack.
#
#   data plane   distrikv-1..3   Raft cluster, private network only
#   edge         gateway         the ONLY service published to the host (:8080)
#   monitoring   prometheus, grafana   opt-in:  --profile monitoring
#
# Raft/gRPC ports and the /metrics ports are never published.
x-node: &node
  build: .
  image: distrikv:latest
  networks: [distrikv-net]
  healthcheck:
    test: ["CMD", "nc", "-z", "localhost", "8080"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  distrikv-1:
    <<: *node
    container_name: distrikv-1
    environment: [DISTRIKV_DATA_DIR=/var/lib/distrikv]
    volumes: [distrikv-data-1:/var/lib/distrikv]
    command: >
      -id=node1 -addr=:8080 -metrics-addr=:9101
      -peers=node1@distrikv-1:8080,node2@distrikv-2:8080,node3@distrikv-3:8080
      -data-dir=/var/lib/distrikv -snapshot-every=1024

  distrikv-2:
    <<: *node
    container_name: distrikv-2
    environment: [DISTRIKV_DATA_DIR=/var/lib/distrikv]
    volumes: [distrikv-data-2:/var/lib/distrikv]
    command: >
      -id=node2 -addr=:8080 -metrics-addr=:9101
      -peers=node1@distrikv-1:8080,node2@distrikv-2:8080,node3@distrikv-3:8080
      -data-dir=/var/lib/distrikv -snapshot-every=1024

  distrikv-3:
    <<: *node
    container_name: distrikv-3
    environment: [DISTRIKV_DATA_DIR=/var/lib/distrikv]
    volumes: [distrikv-data-3:/var/lib/distrikv]
    command: >
      -id=node3 -addr=:8080 -metrics-addr=:9101
      -peers=node1@distrikv-1:8080,node2@distrikv-2:8080,node3@distrikv-3:8080
      -data-dir=/var/lib/distrikv -snapshot-every=1024

  gateway:
    image: distrikv:latest
    container_name: distrikv-gateway
    depends_on:
      distrikv-1: {condition: service_healthy}
      distrikv-2: {condition: service_healthy}
      distrikv-3: {condition: service_healthy}
    restart: unless-stopped
    entrypoint: ["gateway"]
    command: >
      -db=/var/lib/gateway/gateway.db
      -bind=:8080 -metrics-addr=:9100
      -control-bind=:9091 -control-origins=${CONTROL_ORIGINS:-http://localhost:5173}
      -kv-addrs=distrikv-1:8080,distrikv-2:8080,distrikv-3:8080
    ports:
      - "${GATEWAY_PORT:-8080}:8080"   # the public data plane
      # Console control API: loopback only. Put your web console / reverse proxy
      # in front of it; do not publish it to the internet unauthenticated by a proxy.
      - "127.0.0.1:${CONTROL_PORT:-9091}:9091"
    volumes: [gateway-data:/var/lib/gateway]   # SQLite: tenants + hashed keys. BACK THIS UP.
    networks: [distrikv-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [monitoring]
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [distrikv-net]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [monitoring]
    depends_on: [prometheus]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [distrikv-net]

networks:
  distrikv-net:
    driver: bridge

volumes:
  distrikv-data-1:
  distrikv-data-2:
  distrikv-data-3:
  gateway-data:
