// Internal Raft transport RPCs (node-to-node). These are NOT part of the
// client-facing API (proto/kv.proto).
//
// Phase 13 status: InstallSnapshot added as its own RPC (as originally
// planned — a new RPC, not a change to the others). The request/response
// shapes follow the Raft paper.
//
// Every request carries `term`: receivers can reject stale-term messages
// early (the term-awareness Raft requires).

syntax = "proto3";

package distrikv.raft.v1;

option go_package = "distrikv/gen/raft/v1;raftpb";

service RaftService {
  // Ping is transport-level connectivity verification (boot-time peer probe,
  // cluster tests). Raft heartbeats ride AppendEntries instead.
  rpc Ping(PingRequest) returns (PingResponse);

  // RequestVote implements Raft's RequestVote RPC (Phase 5).
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // PreVote implements the pre-vote phase (Raft dissertation §9.6): a
  // prospective candidate first asks whether it WOULD win an election —
  // no term changes and no vote recorded on either side — and only a
  // majority of pre-votes unlocks the real RequestVote. A node that
  // cannot win (partitioned, stale log, or talking to a majority that
  // still hears a live leader) therefore never inflates its term and
  // never disrupts a healthy cluster. A new RPC, like InstallSnapshot
  // (Phase 13): not a change to the existing ones.
  rpc PreVote(PreVoteRequest) returns (PreVoteResponse);

  // AppendEntries implements Raft's AppendEntries RPC (Phase 6). With an
  // empty entries list it is also the heartbeat.
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

  // InstallSnapshot implements Raft's InstallSnapshot RPC (Phase 13): used
  // when a follower is too far behind for entries — its prevLog anchor is
  // below the leader's compaction point — so the leader ships the snapshot
  // itself instead of thousands of discarded entries.
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

message PingRequest {
  // Sender's node ID (misconfiguration detection).
  string from_node_id = 1;
}

message PingResponse {
  // Responder's node ID — the sender verifies it matches the peer it meant
  // to reach; a mismatch means two nodes disagree about who is who.
  string node_id = 1;
}

// LogEntry is the wire form of a Raft log entry (distinct from the on-disk
// form in internal/raftlog; the Raft core converts between them).
message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes payload = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  // Phase 17 (Multi-Raft): which Raft group this vote is for. The
  // transport multiplexes groups over one connection per peer pair and
  // the receiving node demuxes on this field. A missing field reads as
  // 0, so group 0 is the default and pre-existing single-group messages
  // are unchanged.
  uint64 group_id = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

// PreVoteRequest is the advisory twin of RequestVote: it asks "would you
// vote for me at `term`?" while changing nothing — the responder persists
// no term and no vote, and neither does the sender (there is nothing to
// fsync on this path). `term` is the term the sender WOULD campaign in,
// i.e. its current term + 1.
message PreVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  // Phase 17 (Multi-Raft): which Raft group this pre-vote is for (see
  // RequestVoteRequest.group_id).
  uint64 group_id = 5;
}

// PreVoteResponse.term is the RESPONDER's current term, still unchanged
// by this exchange — a pre-vote round never moves a term in either
// direction. vote_granted means "you could win here", not "you have my
// vote": the real vote is cast later, in RequestVote.
message PreVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
  // Phase 17 (Multi-Raft): which Raft group this append is for (see
  // RequestVoteRequest.group_id).
  uint64 group_id = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  // The log position the payload reconstructs (Raft's lastIncludedIndex/
  // lastIncludedTerm) — everything at or before last_included_index is
  // inside the snapshot and may already be compacted away on the leader.
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  // The state machine's serialized state: opaque to raft (only the same
  // state machine reads it back).
  bytes data = 5;
  // Phase 17 (Multi-Raft): which Raft group this snapshot is for (see
  // RequestVoteRequest.group_id).
  uint64 group_id = 6;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool success = 2;
}
