// DistriKV public KV API.
//
// Status: client RPCs (Phase 2), replicated Command encoding (Phase 7),
// leader routing (Phase 8), client sessions (Phase 9), state-machine
// snapshots (Phase 12). Every mutating
// request carries client_id/sequence_number; since Phase 9 the server
// REQUIRES them (InvalidArgument otherwise) and replicates them inside the
// Command so the state machine can suppress duplicate application of a
// retried request (see docs/consistency.md S1 for the precise guarantee).
//
// Design notes:
//   - GET/EXISTS are reads: they never enter the Raft log. Mutating RPCs are
//     the future log entries.
//   - CAS precondition failure is a NORMAL OUTCOME (applied=false), not a
//     gRPC error: all replicas must agree on it, and the session table
//     caches it like any other response so a retry replays it.
//   - proto3 bytes fields cannot distinguish "absent" from "empty", so CAS
//     carries an explicit expected_exists flag instead of relying on nil.

syntax = "proto3";

package distrikv.v1;

option go_package = "distrikv/gen/kv/v1;kv1";

// KVService is the DistriKV key-value API. Phases 4+ add a separate internal
// Raft transport service; this service is the client-facing surface.
service KVService {
  // Get returns the value for key, or NOT_FOUND.
  rpc Get(GetRequest) returns (GetResponse);

  // Put stores value at key (upsert).
  rpc Put(PutRequest) returns (PutResponse);

  // Delete removes key (idempotent).
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Exists reports key presence.
  rpc Exists(ExistsRequest) returns (ExistsResponse);

  // CAS atomically stores new_value iff the precondition holds.
  rpc CAS(CASRequest) returns (CASResponse);

  // Incr atomically adds delta to the int64 stored at key
  // (negative delta = decrement; absent key treated as 0).
  rpc Incr(IncrRequest) returns (IncrResponse);

  // GetStatus reports this node's identity and Raft role plus the address of
  // the current leader, so clients can route mutations (Phase 8). It is a
  // read: any node answers, whatever its role.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bytes value = 1;
}

message PutRequest {
  string key = 1;
  bytes value = 2;
  // Client session (required since Phase 9): stable per SDK connection,
  // sequence_number >= 1, one number per logical operation (retries of
  // that operation reuse it).
  string client_id = 3;
  uint64 sequence_number = 4;
}

message PutResponse {}

message DeleteRequest {
  string key = 1;
  string client_id = 2;
  uint64 sequence_number = 3;
}

message DeleteResponse {}

message ExistsRequest {
  string key = 1;
}

message ExistsResponse {
  bool exists = 1;
}

message CASRequest {
  string key = 1;
  // expected_exists=false  => the key must be ABSENT for the swap to succeed.
  // expected_exists=true   => the key must equal expected_value.
  bool expected_exists = 2;
  bytes expected_value = 3;
  bytes new_value = 4;
  string client_id = 5;
  uint64 sequence_number = 6;
}

message CASResponse {
  // applied=false means the precondition failed — a normal outcome, not an
  // error.
  bool applied = 1;
}

message IncrRequest {
  string key = 1;
  // Signed: +1 increments, -1 decrements.
  int64 delta = 2;
  string client_id = 3;
  uint64 sequence_number = 4;
}

message IncrResponse {
  // The new value after the operation.
  int64 value = 1;
}

// ---------------------------------------------------------------------------
// Replicated command encoding (Phase 7).
//
// Client RPCs above are translated into exactly one Command and proposed to
// Raft; the encoded Command is what every replica finds in its log entry and
// decodes. Same bytes + same order => same state on every replica (the
// determinism invariant of docs/architecture.md).
// ---------------------------------------------------------------------------

// CommandOp mirrors the kv.Op vocabulary (values are fixed so log entries
// stay decodable across versions).
enum CommandOp {
  COMMAND_OP_UNSPECIFIED = 0;
  COMMAND_OP_SET = 1;
  COMMAND_OP_DELETE = 2;
  COMMAND_OP_CAS = 3;
  COMMAND_OP_INCR = 4;
}

// Command is the unit of replication: one deterministic mutation riding in
// one Raft log entry.
//
// client_id/sequence_number ride in the LOGGED command (Phase 9): the
// session table is replicated state applied from entries, so dedup must
// read its keys from the same entries — an entry with session fields
// suppressed as a duplicate is still applied (as a no-op) on every replica
// identically.
message Command {
  CommandOp op = 1;
  string key = 2;
  // SET value / CAS new value.
  bytes value = 3;
  // CAS precondition, presence-explicit like CASRequest above:
  // expected_exists=false => key must be ABSENT; true => key must equal
  // expected_value (empty-but-present is a legal precondition).
  bool expected_exists = 4;
  bytes expected_value = 5;
  // INCR signed delta.
  int64 delta = 6;
  // Client session identity (Phase 9). client_id == "" marks an internal /
  // test command that opts out of deduplication (always applied).
  string client_id = 7;
  uint64 sequence_number = 8;
}

// GetStatus is the leader-routing discovery call (Phase 8).
// With a key (Phase 20): the server returns the status of the Raft group
// that owns that key (key -> slot -> group). Empty key means group 0,
// preserving backward compatibility with single-group clusters.
message GetStatusRequest {
  string key = 1;
}

message GetStatusResponse {
  // The node that answered.
  string node_id = 1;
  // Raft role: follower | candidate | leader.
  string role = 2;
  // Who this node believes leads the cluster; "" = no leader known yet
  // (election in progress).
  string leader_id = 3;
  // The leader's dialable address per the server's static -peers
  // membership — must be client-reachable for routing hints to work.
  // "" when unknown to this node (including standalone deployments, where
  // leader_id == node_id means "you are already on the leader").
  string leader_addr = 4;
}

// ---------------------------------------------------------------------------
// State-machine snapshot (Phase 12).
//
// SM.Snapshot serializes the COMPLETE kv.SM state — engine key space plus
// the client-session table — into one payload the Raft layer persists
// alongside its log and reloads at startup before replaying the log tail
// (spec §15). The payload is opaque to Raft; only kv.SM reads it back.
//
// Determinism: sessions are emitted sorted by client_id, so the same state
// always produces identical bytes (snapshot tests compare them directly).
// ---------------------------------------------------------------------------

// StateMachineSnapshot is kv.SM's full state at one log position.
message StateMachineSnapshot {
  // The engine's own encoding (opaque here — only Engine.Restore reads it).
  bytes engine_state = 1;
  // One entry per live session, sorted by client_id.
  repeated SessionState sessions = 2;
  // The SM's next session-birth counter. Restoring it exactly keeps
  // deterministic session eviction (sessionCap in sm.go) aligned across
  // replicas after a restore.
  uint64 next_session_birth = 3;
}

// SessionState is one dedup session as it appears in a snapshot.
message SessionState {
  string client_id = 1;
  // The last sequence applied for this session (dedup high-water mark).
  uint64 last_sequence = 2;
  // Cached response of that application.
  bool applied = 3;
  bytes result_value = 4;
  // Error() of the cached domain error; "" = none. Known sentinels
  // (ErrNotInteger/ErrOverflow/...) map back to their error values on
  // restore so a replayed retry still answers errors.Is correctly.
  string result_error = 5;
  // Session creation order (deterministic eviction tie-breaker).
  uint64 birth = 6;
}
