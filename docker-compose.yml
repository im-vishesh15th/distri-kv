services:
  distrikv-1:
    build: .
    image: distrikv:latest
    container_name: distrikv-1
    environment:
      - DISTRIKV_DATA_DIR=/var/lib/distrikv
    ports:
      - "8081:8080"
    volumes:
      - distrikv-data-1:/var/lib/distrikv
    networks:
      - distrikv-net
    command: >
      -id=node1
      -addr=:8080
      -peers=node1@distrikv-1:8080,node2@distrikv-2:8080,node3@distrikv-3:8080
      -data-dir=/var/lib/distrikv
      -snapshot-every=1024
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  distrikv-2:
    build: .
    image: distrikv:latest
    container_name: distrikv-2
    environment:
      - DISTRIKV_DATA_DIR=/var/lib/distrikv
    ports:
      - "8082:8080"
    volumes:
      - distrikv-data-2:/var/lib/distrikv
    networks:
      - distrikv-net
    command: >
      -id=node2
      -addr=:8080
      -peers=node1@distrikv-1:8080,node2@distrikv-2:8080,node3@distrikv-3:8080
      -data-dir=/var/lib/distrikv
      -snapshot-every=1024
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  distrikv-3:
    build: .
    image: distrikv:latest
    container_name: distrikv-3
    environment:
      - DISTRIKV_DATA_DIR=/var/lib/distrikv
    ports:
      - "8083:8080"
    volumes:
      - distrikv-data-3:/var/lib/distrikv
    networks:
      - distrikv-net
    command: >
      -id=node3
      -addr=:8080
      -peers=node1@distrikv-1:8080,node2@distrikv-2:8080,node3@distrikv-3:8080
      -data-dir=/var/lib/distrikv
      -snapshot-every=1024
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  distrikv-net:
    driver: bridge

volumes:
  distrikv-data-1:
  distrikv-data-2:
  distrikv-data-3: